name: Deploy web app to Pages
on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'assets/brand/**', 'packages/**', 'tools/build-support.mjs', 'package*.json', '.github/workflows/static.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH }}
      REPOSITORY_URL: ${{ vars.REPOSITORY_URL || vars.PUBLIC_REPOSITORY_URL }}
      DOCS_URL: ${{ vars.DOCS_URL || vars.PUBLIC_DOCS_URL }}
      COMMUNITY_URL: ${{ vars.COMMUNITY_URL || vars.PUBLIC_COMMUNITY_URL }}
      FEEDBACK_URL: ${{ vars.FEEDBACK_URL || vars.PUBLIC_FEEDBACK_URL }}
      NEWSLETTER_URL: ${{ vars.NEWSLETTER_URL || vars.PUBLIC_NEWSLETTER_URL }}
      SOCIAL_X_URL: ${{ vars.SOCIAL_X_URL || vars.PUBLIC_SOCIAL_X_URL }}
      SOCIAL_LINKEDIN_URL: ${{ vars.SOCIAL_LINKEDIN_URL || vars.PUBLIC_SOCIAL_LINKEDIN_URL }}
      SOCIAL_MASTODON_URL: ${{ vars.SOCIAL_MASTODON_URL || vars.PUBLIC_SOCIAL_MASTODON_URL }}
      CONTACT_URL: ${{ vars.CONTACT_URL || vars.PUBLIC_CONTACT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run web:build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || steps.pages.outputs.origin }}
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH || steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
