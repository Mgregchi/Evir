name: Runtime package validation
on:
  pull_request:
    paths: [ 'packages/project-model/**', 'packages/runtime/**', 'packages/renderer-canvas/**', 'packages/authoring/**', 'packages/format/**', 'tests/runtime/**', 'tools/build-package.mjs', 'tools/build-support.mjs', 'package*.json', '.github/workflows/runtime.yml']
  push:
    branches: [main]
    paths: [ 'packages/project-model/**', 'packages/runtime/**', 'packages/renderer-canvas/**', 'packages/authoring/**', 'packages/format/**', 'tests/runtime/**', 'tools/build-package.mjs', 'tools/build-support.mjs', 'package*.json', '.github/workflows/runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:runtime
      - run: npm run runtime:build
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-packages
          path: |
            packages/project-model/dist/
            packages/runtime/dist/
            packages/renderer-canvas/dist/
            packages/authoring/dist/
            packages/format/dist/
