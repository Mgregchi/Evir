name: Account service validation
on:
  pull_request:
    paths: ['packages/service/**', 'apps/web/**', 'tests/service/**', 'tools/deploy-cloudflare.mjs', 'package*.json', '.github/workflows/service.yml']
  push:
    branches: [main]
    paths: ['packages/service/**', 'apps/web/**', 'tests/service/**', 'tools/deploy-cloudflare.mjs', 'package*.json', '.github/workflows/service.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run web:build
      - run: npm run test:service
      - run: npx wrangler deploy --config apps/web/wrangler.jsonc --dry-run --outdir /tmp/evir-worker
        env:
          WRANGLER_SEND_METRICS: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-auth-validation
          path: research/results/cloudflare-auth/
