name: Web and Studio validation
on:
  pull_request:
    paths: ['apps/web/**', 'assets/brand/**', 'assets/fonts/**', 'packages/**', 'tests/site/**', 'tests/editor/**', 'tests/frontend/**', 'tools/build-support.mjs', 'tools/static-server.mjs', 'tools/profile-workflow.mjs', 'tools/validate-playback.cjs', 'tools/validate_editor_authoring.cjs', 'tools/validate-authoring-suite.cjs', 'tools/generate-authoring-suite.mjs', 'tools/validate-strokes.cjs', 'tools/validate-joining.cjs', 'tools/validate-weights.cjs', 'tools/validate-import-geometry.cjs', 'tools/validate-direct-blends.cjs', 'tests/fixtures/**', 'tools/runtime-oracle.mjs', 'tools/prepare-oracle.cjs', 'tools/browser.cjs', 'tools/gpu_diagnostics.cjs', 'package*.json', '.github/workflows/web.yml']
  push:
    branches: [main]
    paths: ['apps/web/**', 'assets/brand/**', 'assets/fonts/**', 'packages/**', 'tests/site/**', 'tests/editor/**', 'tests/frontend/**', 'tools/build-support.mjs', 'tools/static-server.mjs', 'tools/profile-workflow.mjs', 'tools/validate-playback.cjs', 'tools/validate_editor_authoring.cjs', 'tools/validate-authoring-suite.cjs', 'tools/generate-authoring-suite.mjs', 'tools/validate-strokes.cjs', 'tools/validate-joining.cjs', 'tools/validate-weights.cjs', 'tools/validate-import-geometry.cjs', 'tools/validate-direct-blends.cjs', 'tests/fixtures/**', 'tools/runtime-oracle.mjs', 'tools/prepare-oracle.cjs', 'tools/browser.cjs', 'tools/gpu_diagnostics.cjs', 'package*.json', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:frontend
      - run: npm run test:editor
      - run: npm run test:web
      - run: npm run test:experience
      - run: npm run validate:editor
      - uses: actions/upload-artifact@v4
        with:
          name: web-validation
          path: |
            research/results/public-site/
            research/results/showcase-gallery/
            research/results/editor-pen/
            research/results/experience-quality/
            research/results/studio-workspace/
            research/results/studio-navigation/
            research/results/studio-snapping/
            research/results/studio-freehand/
            research/results/studio-gradients/
            research/results/advanced-authoring/
            research/results/studio-workflow/
            research/results/playback/
            research/results/commands/
            research/results/import-guidance/
            research/results/native-strokes/
            research/results/path-joining/
            research/results/skin-weights/
            research/results/import-geometry/
            research/results/direct-blends/
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/web/dist/
