name: Runtime and editor validation
on:
  pull_request:
    paths: ['apps/editor/**', 'packages/**', 'assets/brand/**', 'tests/editor/**', 'tests/runtime/**', 'tools/validate_editor_authoring.cjs', 'tools/build-package.mjs', 'tools/build-support.mjs', 'tools/static-server.mjs', 'tools/browser.cjs', 'tools/prepare-oracle.cjs', 'tools/runtime-oracle.mjs', 'tools/gpu_diagnostics.cjs', 'package*.json', '.github/workflows/runtime-and-editor.yml']
  push:
    branches: [main]
    paths: ['apps/editor/**', 'packages/**', 'assets/brand/**', 'tests/editor/**', 'tests/runtime/**', 'tools/validate_editor_authoring.cjs', 'tools/build-package.mjs', 'tools/build-support.mjs', 'tools/static-server.mjs', 'tools/browser.cjs', 'tools/prepare-oracle.cjs', 'tools/runtime-oracle.mjs', 'tools/gpu_diagnostics.cjs', 'package*.json', '.github/workflows/runtime-and-editor.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      EDITOR_BASE_PATH: ${{ vars.EDITOR_BASE_PATH }}
      EDITOR_PUBLIC_SITE_URL: ${{ vars.EDITOR_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:runtime
      - run: npm run test:editor
      - run: npm run validate:editor
      - run: npm run runtime:build
      - uses: actions/upload-artifact@v4
        with:
          name: editor-web
          path: apps/editor/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-packages
          path: packages/*/dist/
