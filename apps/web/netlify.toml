# In Netlify: base directory = repository root; package directory = apps/web.
[build]
command = "npm run web:build"
publish = "apps/web/dist"
# Netlify: exit 0 skips a build; exit 1 proceeds. First/unknown revisions build.
ignore = '''
if [ -n "$CACHED_COMMIT_REF" ] && [ -n "$COMMIT_REF" ] && [ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- apps/web assets/brand packages tools/build-support.mjs package.json package-lock.json; then exit 0; else exit 1; fi
'''

[build.environment]
NODE_VERSION = "24"
