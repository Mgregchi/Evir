<!doctype html><html lang="en"><meta charset="utf-8"><title>Evir original asset capture</title>
<style>body{margin:0;background:#eff3e8}canvas{display:block;width:512px;height:512px}</style>
<canvas width="512" height="512"></canvas><script type="module">
import {drawScene} from '../editor/render-scene.mjs';
const name=new URLSearchParams(location.search).get('example')||'milo';
const project=await(await fetch(`assets/examples/${name}.evir-project`)).json();
drawScene(document.querySelector('canvas').getContext('2d'),project,project.artboards[0].id);
window.assetReady=true;
</script></html>
